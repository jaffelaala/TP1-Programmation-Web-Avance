<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Formulaire MVC</title>
</head>
<body>
    <h2>Formulaire MVC</h2>
    <form action="Controller" method="POST">
        Prénom : <input type="text" name="firstName"><br><br>
        Nom : <input type="text" name="lastName"><br><br>
        Date de naissance (mm/dd/yyyy) : <input type="text" name="birthDay"><br><br>
        Sexe : 
        <input type="radio" name="sex" value="Homme"> Homme
        <input type="radio" name="sex" value="Femme"> Femme
        <br><br>
        <input type="submit" value="Envoyer">
    </form>
</body>
</html>
